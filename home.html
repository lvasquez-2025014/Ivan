<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Académico Completo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('img/img2.png') no-repeat center center fixed !important;
            background-size: cover !important;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* Ancho del 80% solicitado */
        .container {
            width: 80%;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header-main { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* Formulario en línea para ahorrar espacio */
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1.5fr auto;
            gap: 15px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            align-items: end;
        }

        /* Filtros combinados */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Grid de tareas */
        #taskList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 5px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.2s;
        }

        .task-card.completed { border-left-color: #10b981; opacity: 0.6; }

        .countdown {
            font-family: 'Courier New', monospace;
            margin-top: 15px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .time-normal { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .time-urgent { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid #fbbf24; }
        .time-overdue { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        input, select, textarea {
            background: #1e293b; color: white; border: 1px solid #334155; 
            padding: 12px; border-radius: 8px; width: 100%;
        }

        .btn-add { background: white; color: #0f172a; font-weight: bold; cursor: pointer; border: none; height: 45px; padding: 0 25px; border-radius: 8px; }
        .btn-delete { background: none; color: #ef4444; border: none; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div class="header-main">
            <h1>🎓 Mi Panel Académico</h1>
        </div>

        <div class="form-grid">
            <div>
                <label>Descripción de Tarea</label>
                <input type="text" id="taskInput" placeholder="¿Qué hay que hacer?">
            </div>
            <div>
                <label>Materia</label>
                <select id="subjectSelect">
                    <option value="CIENCIAS SOCIALES II">CIENCIAS SOCIALES II</option>
                    <option value="Inglés II">Inglés II</option>
                    <option value="Fisica ll">Física II</option>
                    <option value="Lengua ll">Lengua II</option>
                    <option value="Matematicas ll">Matemáticas II</option>
                    <option value="Quimica 5">Química 5</option>
                    <option value="Taller ll">Taller II</option>
                    <option value="TIC II">TIC II</option>
                </select>
            </div>
            <div>
                <label>Tipo</label>
                <select id="typeSelect">
                    <option value="Individual">Individual</option>
                    <option value="Grupal">Grupal</option>
                </select>
            </div>
            <div>
                <label>Fecha y Hora Límite</label>
                <input type="datetime-local" id="dateInput">
            </div>
            <button class="btn-add" onclick="addTask()">AGREGAR</button>
        </div>

        <div class="filter-bar">
            <div>
                <span>Filtrar Materia:</span>
                <select id="filterSubject" onchange="renderTasks()" style="width: auto; margin-left: 10px;">
                    <option value="all">Todas</option>
                    <option value="CIENCIAS SOCIALES II">CIENCIAS SOCIALES II</option>
                    <option value="Inglés II">Inglés II</option>
                    <option value="Fisica ll">Física II</option>
                    <option value="Lengua ll">Lengua II</option>
                    <option value="Matematicas ll">Matemáticas II</option>
                    <option value="Quimica 5">Química 5</option>
                    <option value="Taller ll">Taller II</option>
                    <option value="TIC II">TIC II</option>
                </select>
            </div>
            <div>
                <span>Estado:</span>
                <select id="filterStatus" onchange="renderTasks()" style="width: auto; margin-left: 10px;">
                    <option value="all">Cualquiera</option>
                    <option value="pending">Pendientes</option>
                    <option value="completed">Hechas</option>
                </select>
            </div>
        </div>

        <div id="taskList"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function addTask() {
            const text = document.getElementById('taskInput').value.trim();
            const subject = document.getElementById('subjectSelect').value;
            const type = document.getElementById('typeSelect').value;
            const deadline = document.getElementById('dateInput').value;

            if(!text || !deadline) return alert("Por favor, completa la tarea y la fecha.");

            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks.push({ id: Date.now(), text, subject, type, deadline, completed: false });
            localStorage.setItem('tasks', JSON.stringify(tasks));
            
            document.getElementById('taskInput').value = '';
            renderTasks();
        }

        function toggleTask(id) {
            let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(id) {
            let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const subFilter = document.getElementById('filterSubject').value;
            const statFilter = document.getElementById('filterStatus').value;
            
            let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

            // Aplicación de filtros combinados
            if (subFilter !== 'all') tasks = tasks.filter(t => t.subject === subFilter);
            if (statFilter === 'pending') tasks = tasks.filter(t => !t.completed);
            if (statFilter === 'completed') tasks = tasks.filter(t => t.completed);

            list.innerHTML = tasks.map(t => `
                <div class="task-card ${t.completed ? 'completed' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <span style="color:#38bdf8; font-weight:bold; font-size:0.75rem;">${t.subject}</span>
                            <h3 style="margin:5px 0;">${t.text}</h3>
                            <span style="font-size:0.7rem; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.1);">
                                ${t.type}
                            </span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:10px;">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" style="width:20px; height:20px;">
                            <button class="btn-delete" onclick="deleteTask(${t.id})">&times;</button>
                        </div>
                    </div>
                    <div class="countdown" data-deadline="${t.deadline}">Calculando...</div>
                </div>
            `).join('');
            updateTimers();
        }

        function updateTimers() {
            const now = new Date().getTime();
            document.querySelectorAll('.countdown').forEach(el => {
                const deadline = new Date(el.dataset.deadline).getTime();
                const diff = deadline - now;

                if (diff < 0) {
                    el.innerHTML = "⌛ PLAZO VENCIDO";
                    el.className = "countdown time-overdue";
                } else {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    
                    el.innerHTML = `⏳ Faltan: ${d}d ${h}h ${m}m ${s}s`;
                    // Alerta si falta menos de 24 horas
                    el.className = diff < 86400000 ? "countdown time-urgent" : "countdown time-normal";
                }
            });
        }

        setInterval(updateTimers, 1000);
        window.onload = renderTasks;
    </script>
</body>
</html>
